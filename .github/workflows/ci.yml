name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, audit/parent-dependency-updates]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ostra:ostra_test_password@localhost:5432/ostra_test
      SHADOW_DATABASE_URL: postgresql://ostra:ostra_test_password@localhost:5432/ostra_shadow
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ostra
          POSTGRES_PASSWORD: ostra_test_password
          POSTGRES_DB: ostra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ostra -d ostra_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create migration shadow database
        run: echo "CREATE DATABASE ostra_shadow" | npx prisma db execute --stdin --url "$DATABASE_URL"

      - name: Prepare test database
        run: npx prisma migrate deploy

      - name: Check database schema drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Run npm audit (Phase 9 security check)
        run: |
          audit_exit_code=0
          npm audit --audit-level=moderate --json > "$RUNNER_TEMP/npm-audit.json" || audit_exit_code=$?
          node scripts/check-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json" "$audit_exit_code"

      - name: Check for secrets in code (Phase 9 security check)
        run: |
          set -e
          MATCHES=$(git grep -IlE "(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,}|(password|secret|token|api[_-]?key)[[:space:]]*[:=][[:space:]]*['\"][^'\"]{24,}['\"])" -- ':!*.md' ':!*.test.ts' ':!*.test.tsx' ':!vitest.config.ts' ':!.env*' ':!prisma/schema.prisma' || true)
          if [ -n "$MATCHES" ]; then
            echo "Potential hard-coded credentials found in:"
            echo "$MATCHES"
            exit 1
          fi
