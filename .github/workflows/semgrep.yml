name: Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, audit/parent-dependency-updates]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan with Semgrep
        run: semgrep scan --config p/default --config p/typescript --config p/security-audit --error .
