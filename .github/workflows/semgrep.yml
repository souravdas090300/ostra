name: Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, audit/parent-dependency-updates]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan with Semgrep
        continue-on-error: true
        run: semgrep scan --config p/default --config p/typescript --config p/security-audit --error .
