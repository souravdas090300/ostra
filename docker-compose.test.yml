services:
  postgres-test:
    image: postgres:16
    container_name: postgres-test
    environment:
      POSTGRES_USER: ostra
      POSTGRES_PASSWORD: ostra_test_password
      POSTGRES_DB: ostra_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ostra -d ostra_test"]
      interval: 3s
      timeout: 3s
      retries: 20
